server:
  host: 0.0.0.0
  port: 8000
  workers: 1
  shutdown_grace_seconds: 60

storage:
  default_output_dir: ./outputs
  allowed_output_dirs: [./outputs]
  filename_pattern: "{date}_{uuid}_{resolution}.mp4"
  allowed_formats: [mp4]
  dated_subfolders: true

model:
  repo_id: Lightricks/LTX-2.5-Diffusers
  checkpoint_path: ./models/ltx-2.5-diffusers
  auto_download: true
  device: cuda
  precision: bf16
  # group: streamed offload that prefetches the next block while the current one
  # runs. Set back to sequential to compare against the previous behaviour.
  cpu_offload: group
  group_offload_type: block_level
  # false pins all offloaded weights up front: faster, but needs a second, locked
  # copy of the whole model (~80 GB) in RAM. Keep true unless RAM is far larger.
  group_offload_low_cpu_mem: true
  # Set to int8 to halve RAM->VRAM streaming under sequential offload (needs torchao).
  quantization: none
  # fp8 weight storage with bf16 compute; near-lossless, halves RAM and transfer.
  transformer_fp8_storage: false
  # e.g. flash (needs flash-attn installed); null uses PyTorch SDPA.
  attention_backend: null
  # Encode the prompt once per job instead of once per stage (identical output).
  reuse_prompt_embeds: true
  prompt_cache_size: 2
  vae_tiling: true
  vae_slicing: true
  enable_latent_upsampler: true
  dry_run: false

generation:
  default_resolution: 480p
  max_resolution: 720p
  default_aspect_ratio: "16:9"
  default_fps: 24
  allowed_fps: [24, 25]
  default_duration_seconds: 5
  max_duration_seconds: 20
  default_preset: fast
  generate_audio_by_default: true
  allow_remote_images: true
  input_image_dir: ./inputs

loras:
  - name: fast
    description: Distilled base transformer, reference 8-step sigma schedule
    path: null
    num_inference_steps: 8
    guidance_scale: 1.0
    sigma_schedule: distilled
    multi_stage: false
  - name: quality
    description: Two-stage distilled refinement at 720p; 480p uses a single stage
    path: null
    num_inference_steps: 8
    guidance_scale: 1.0
    sigma_schedule: distilled
    multi_stage: true
    stage2_num_inference_steps: 3

runtime:
  max_concurrent_jobs: 1
  reject_when_busy: true
  job_timeout_seconds: 1800
  max_queue_size: 32
  restart_on_cuda_context_lost: true

prompt_enhancer:
  enabled: false
  base_url: http://192.168.2.56:1234/v1
  model: ministral-3-8b-instruct-2512
  timeout_seconds: 30

logging:
  dir: ./logs
  level: INFO